<header class="app-header">
  <button id="sidebar-toggle" class="icon-btn sidebar-toggle-btn" type="button" aria-label="사이드바 열기" aria-expanded="false">&#9776;</button>
  <div class="header-logo-container">
    <img src="/static/bamboochat-logo.png" alt="" class="header-logo" />
    <h1 class="service-name">{{ service_name }}</h1>
  </div>
  <div class="header-right">
    <div class="my-nick-badge-container">
      <button id="my-nick-badge" class="my-nick-badge" type="button" aria-label="닉네임 변경" title="닉네임 변경"></button>
      <div id="nickname-hint-popover" class="nickname-hint-popover hidden" role="tooltip" aria-live="polite">
        <span class="hint-arrow"></span>
        <div class="hint-body">
          <span class="hint-icon">💡</span>
          <div class="hint-text">
            <strong>닉네임 변경 가능!</strong>
            <span>여기를 클릭해 닉네임을 설정하세요</span>
          </div>
        </div>
        <button id="nickname-hint-close" class="hint-close-btn" type="button" aria-label="닫기">×</button>
      </div>
    </div>
    <div class="quiz-btn-container">
      <button id="quiz-btn" class="quiz-header-btn" type="button" title="오늘의 퀴즈 & 리더보드" aria-label="오늘의 퀴즈 & 리더보드">
        <span class="quiz-btn-icon">🧠</span>
        <span class="quiz-btn-text">퀴즈 & 랭킹</span>
        <span id="header-quiz-streak" class="header-quiz-streak hidden">🔥 <span id="header-streak-count">0</span></span>
      </button>
      <div id="quiz-hint-popover" class="nickname-hint-popover quiz-hint-popover hidden" role="tooltip" aria-live="polite">
        <span class="hint-arrow"></span>
        <div class="hint-body">
          <span class="hint-icon">⚡</span>
          <div class="hint-text">
            <strong>퀴즈 & 랭킹 센터!</strong>
            <span>오늘의 문제를 풀고 연속 스트릭에 도전하세요</span>
          </div>
        </div>
        <button id="quiz-hint-close" class="hint-close-btn" type="button" aria-label="닫기">×</button>
      </div>
    </div>
    <div class="chess-btn-container">
      <button id="chess-btn" class="quiz-header-btn" type="button" title="대나무숲 체스" aria-label="대나무숲 체스">
        <span class="quiz-btn-icon">♟️</span>
        <span class="quiz-btn-text">체스</span>
      </button>
    </div>
    <span id="conn-status" class="conn-status disconnected" role="status" aria-live="polite">연결 끊김</span>
    <button id="admin-btn" class="admin-btn hidden" type="button" aria-label="관리">관리</button>
    <button id="header-notif-btn" class="icon-btn header-notif-btn" type="button" title="전체 알림 설정" aria-label="전체 알림 설정">🔔</button>
    <button id="logout-btn" class="logout-btn" type="button" aria-label="로그아웃">로그아웃</button>
    <button id="help-btn" class="help-btn" type="button" aria-label="기능 도움말" title="기능 도움말">?</button>
  </div>
</header>
